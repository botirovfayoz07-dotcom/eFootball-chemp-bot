<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Team battle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070d1a"/>
      <stop offset=".46" stop-color="#0f2f74"/>
      <stop offset=".78" stop-color="#5c1720"/>
      <stop offset="1" stop-color="#8a1c14"/>
    </linearGradient>
    <radialGradient id="cy" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#63e6ff" stop-opacity=".55"/>
      <stop offset=".62" stop-color="#35c6ff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#35c6ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="am" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffb03a" stop-opacity=".5"/>
      <stop offset=".62" stop-color="#ff5c3a" stop-opacity=".14"/>
      <stop offset="1" stop-color="#ff5c3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="streak" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".16"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#bg)"/>
  <ellipse cx="250" cy="250" rx="290" ry="290" fill="url(#cy)"/>
  <ellipse cx="560" cy="260" rx="280" ry="280" fill="url(#am)"/>

  <g stroke="#ffffff" stroke-opacity=".07" stroke-width="1">
    <path d="M0 340 L800 180M0 400 L800 240M0 460 L800 300"/>
    <path d="M0 160 L800 20"/>
  </g>

  <g fill="none" stroke-width="2.4">
    <circle cx="300" cy="246" r="118" stroke="#7fe6ff" stroke-opacity=".5"/>
    <circle cx="300" cy="246" r="96" stroke="#7fe6ff" stroke-opacity=".18"/>
    <circle cx="500" cy="254" r="118" stroke="#ffc46b" stroke-opacity=".45"/>
    <circle cx="500" cy="254" r="96" stroke="#ffc46b" stroke-opacity=".16"/>
  </g>

  <g stroke="#fff" stroke-opacity=".22" stroke-width="3" stroke-linecap="round">
    <path d="M348 208 L452 300"/>
    <path d="M452 208 L348 300"/>
  </g>

  <rect x="-80" y="96" width="960" height="86" fill="url(#streak)" transform="rotate(-9 400 250)"/>
  <rect x="-80" y="384" width="960" height="52" fill="url(#streak)" transform="rotate(-9 400 250)" opacity=".6"/>
