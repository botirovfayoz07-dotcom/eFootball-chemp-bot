<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>eFootball</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="splash"><div class="spot"></div>
  <div class="splash-in"><div class="ball-wrap"><i class="ring"></i><svg class="emblem" viewBox="0 0 100 100"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#7c3aed"/></linearGradient></defs>
    <circle cx="50" cy="50" r="46" fill="#0b1226" stroke="url(#lg)" stroke-width="3"/>
    <path d="M34 26h32v14c0 10-7 17-16 17s-16-7-16-17V26z" fill="url(#lg)"/>
    <path d="M34 30h-8c0 9 4 14 10 15M66 30h8c0 9-4 14-10 15" fill="none" stroke="url(#lg)" stroke-width="3" stroke-linecap="round"/>
    <rect x="46" y="57" width="8" height="10" fill="url(#lg)"/><rect x="36" y="67" width="28" height="6" rx="2" fill="url(#lg)"/></svg></div>
  <h1 class="splash-title">eFOOTBALL</h1><p class="splash-tag" data-i18n="splashTag"></p>
  <div class="loader"><i></i></div></div></div>
<header class="topbar">
  <div class="brand"><span class="ball">⚽</span><span class="brand-text">eFOOTBALL</span></div>

  <div class="right"><span id="uname"></span><div class="lang" id="lang">
    <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
      <span class="dash">—</span><span id="langCur">UZ</span>
    </button>
    <ul class="lang-menu" id="langMenu" hidden>
      <li><button data-lang="uz">UZ · O'zbekcha</button></li>
      <li><button data-lang="en">EN · English</button></li>
      <li><button data-lang="ru">RU · Русский</button></li>
    </ul>
  </div></div>
</header>

<main class="page">
  <h1 class="section-title" data-i18n="chooseSection"></h1>

  <div class="carousel" id="carousel">
  <button class="card card-official" data-section="official">
    <svg class="ico" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
    <h2 data-i18n="officialTitle"></h2>
    <p data-i18n="officialSub"></p>
  </button>

  <button class="card card-private" data-section="private">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20M4 4h5M4 4v5M20 4h-5M20 4v5M4 20h5M4 20v-5M20 20h-5M20 20v-5"/></svg>
    <h2 data-i18n="privateTitle"></h2>
    <p data-i18n="privateSub"></p>
  </button>
  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i></div>

  <button class="card card-division" data-section="division">
    <svg class="ico" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <h2 data-i18n="divisionTitle"></h2>
    <p data-i18n="divisionSub"></p>
  </button>

  <button class="guide" data-section="guide">
    <span class="guide-ico">📖</span>
    <span class="guide-text">
      <b data-i18n="guideTitle"></b>
      <small data-i18n="guideSub"></small>
    </span>
    <span class="chev">›</span>
  </button>

  <button class="guide admin-btn" id="adminBtn" data-section="admin" hidden>
    <span class="guide-ico">🛠</span>
    <span class="guide-text">
      <b data-i18n="adminTitle"></b>
      <small data-i18n="adminSub"></small>
    </span>
    <span class="chev">›</span>
  </button>
</main>

<section id="official" class="page" hidden>
  <button class="back" data-back><span>←</span> <span data-i18n="back"></span></button>
  <h1 class="section-title" data-i18n="chooseMode"></h1>
  <div class="mode-slider" id="modeSlider">
    <button class="rb m-leagues" data-mode="leagues"><span class="rb-in"><img src="cards/modes/leagues.jpg" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl" data-i18n="modeLeagues"></span></span></button>
    <button class="rb m-world" data-mode="world"><span class="rb-in"><img src="cards/modes/world.jpg" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl" data-i18n="modeWorld"></span></span></button>
    <button class="rb m-cl" data-mode="cl"><span class="rb-in"><img src="cards/modes/cl.jpg" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl cup">UEFA<br>CHAMPIONS<br>LEAGUE</span></span></button>
    <button class="rb m-el" data-mode="el"><span class="rb-in"><img src="cards/modes/el.jpg" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl cup">UEFA<br>EUROPA<br>LEAGUE</span></span></button>
    <button class="rb m-conf" data-mode="conference"><span class="rb-in"><img src="cards/modes/conference.png" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl cup">UEFA<br>CONFERENCE<br>LEAGUE</span></span></button>
    <button class="rb m-afc" data-mode="afc"><span class="rb-in"><img src="cards/modes/afc.jpg" alt="" onerror="this.closest('.rb').classList.add('noimg')"><span class="lbl cup">AFC<br>CHAMPIONS<br>LEAGUE</span></span></button>
  </div>
  <div class="dots" id="modeDots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div>
</section>

<section id="league" hidden></section>
<section id="guide" hidden></section>
<section id="unofficial" hidden></section>
<section id="admin" hidden></section>
<div class="toast" id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="league-data.js"></script>
<script src="img-map.js"></script>
<script src="rating.js"></script>
<script src="profile.js"></script>
<script src="shop.js"></script>
<script src="league.js"></script>
<script src="unofficial.js"></script>
<script src="admin.js"></script>
<script src="guide-data.js"></script>
<script src="guide.js"></script>
<script src="app.js"></script>
</body>
</html>
